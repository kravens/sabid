name: release
# A tag v* builds the Linux x86_64 binary, packages it with the docs and the regtest smoke test,
# writes SHA256SUMS, signs it with the maintainer's PGP key when the SIGNING_PGP_KEY secret exists
# (else the maintainer signs by hand, see README "Releases"), and publishes a pre-release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_PGP_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release --locked
      - name: test
        run: cargo test --release --workspace --locked
      - name: package
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME:-dev}"
          NAME="sabid-${TAG}-linux-x64"
          mkdir -p "dist/$NAME/scripts"
          cp target/release/sabid README.md LICENSE PLAN.md "dist/$NAME/"
          cp scripts/regtest-smoke.sh "dist/$NAME/scripts/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: import the release PGP key
        if: env.HAS_SIGNING_KEY == 'true'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.SIGNING_PGP_KEY }}
          passphrase: ${{ secrets.SIGNING_PGP_PASSPHRASE }}
      - name: sign SHA256SUMS
        if: env.HAS_SIGNING_KEY == 'true'
        run: gpg --batch --yes --detach-sign --output dist/SHA256SUMS.sig dist/SHA256SUMS && gpg --verify dist/SHA256SUMS.sig dist/SHA256SUMS
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
