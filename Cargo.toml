[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hex = "0.4"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
bitcoin = { version = "0.32", features = ["serde", "rand-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package]
name = "sabid"
version = "0.1.1"
edition = "2021"
description = "Rust re-implementation of the Wasabi Wallet daemon (WabiSabi coinjoin client, JSON-RPC, CLI, MCP)"
license = "MIT"

[dependencies]
wabisabi = { path = "crates/wabisabi" }
wasabi-proto = { path = "crates/wasabi-proto" }
wallet = { path = "crates/wallet" }
coinjoin = { path = "crates/coinjoin" }
hw = { path = "crates/hw" }
tokio-util = "0.7"
rand = { workspace = true }
bitcoin = { workspace = true }
reqwest = { workspace = true }
axum = "0.8"
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
clap = { version = "4", features = ["derive"] }
dirs = "6"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = "1"
bip39 = { version = "2", features = ["rand"] }
